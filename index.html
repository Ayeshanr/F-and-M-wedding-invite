
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>F & M Wedding Invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #470819;
}

/* THE SECOND PAGE */

.second-page {
  position: fixed;
  inset: 0;
  overflow-y: auto;
  background: radial-gradient(
    circle,
    #85203e 0%,
    #470819 100%
  );
  color: #e8c583;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px 20px;
  font-family: "Cormorant Garamond", serif;
}

.card {
  width: 100%;
  max-width: 650px;
  min-height: 80%;
  border: 2px solid #d5ae6b;
  outline: 1px solid #d5ae6b;
  outline-offset: -12px;
  padding: 65px 25px;
  text-align: center;
  box-shadow: 0 10px 40px #2c0010;
}

.arabic {
  font-size: clamp(24px, 6vw, 38px);
  line-height: 1.8;
}

.subtitle {
  font-size: 19px;
  line-height: 1.6;
}

.names {
  font-family: "Great Vibes", cursive;
  font-weight: normal;
  font-size: clamp(40px, 8vw, 65px);
  line-height: 1.5;
}

.divider {
  width: 150px;
  height: 1px;
  background: #d5ae6b;
  margin: 30px auto;
}

.date {
  font-size: 23px;
  letter-spacing: 2px;
}

/* FIRST PAGE - IMAGE COVER */

.cover {
  position: fixed;
  inset: 0;
  z-index: 100;
  overflow: hidden;
  perspective: 1600px;
  cursor: pointer;
  background: #470819;
}

/* IMAGE SPLIT INTO TWO HALVES */

.half {
  position: absolute;
  top: 0;
  width: 50%;
  height: 100%;
  background-image: url("cover.jpg");
  background-repeat: no-repeat;
  background-size: 200% 100%;
  backface-visibility: hidden;
  transition: transform 2s cubic-bezier(
    .65, 0, .25, 1
  );
}

.left {
  left: 0;
  background-position: left center;
  transform-origin: left center;
}

.right {
  right: 0;
  background-position: right center;
  transform-origin: right center;
}

/* OPENING EFFECT */

.cover.open {
  background: transparent;
  pointer-events: none;
}

.cover.open .left {
  transform: rotateY(-110deg);
}

.cover.open .right {
  transform: rotateY(110deg);
}

/* HIDE THE COVER AFTER OPENING */

.cover.hidden {
  display: none;
}

/* MOBILE */

@media (max-width: 600px) {
  .card {
    padding: 55px 20px;
  }
}
</style>
</head>

<body>

<!-- SECOND PAGE: HIDDEN BEHIND COVER -->

<section class="second-page">

  <div class="card">

    <div class="arabic" lang="ar" dir="rtl">
      بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
    </div>

    <p class="subtitle">
      In the name of Allah, the Entirely
      Merciful, the Especially Merciful.
    </p>

    <div class="divider"></div>

    <h1 class="names">
      Muhammad Faizan
      <br>
      &amp;
      <br>
      Sidra tul-Muntaha
    </h1>

    <p class="subtitle">
      Together with their families<br>
      cordially invite you to their wedding
    </p>

    <div class="divider"></div>

    <p class="date">
      DECEMBER 3–6, 2026
    </p>

  </div>

</section>

<!-- FIRST PAGE: ONLY YOUR IMAGE -->

<div class="cover"
     id="cover"
     role="button"
     tabindex="0"
     aria-label="Open wedding invitation">

  <div class="half left"></div>
  <div class="half right"></div>

</div>

<script>

const cover = document.getElementById("cover");

function openInvitation() {

  if (cover.classList.contains("open")) return;

  cover.classList.add("open");

  setTimeout(function() {
    cover.classList.add("hidden");
  }, 2100);

}

cover.addEventListener("click", openInvitation);

cover.addEventListener("keydown", function(event) {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    openInvitation();
  }
});

</script>

</body>
</html>
